<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Home Screen web app (iPhone + Android). Standalone display, no service
         worker — the UI is useless offline anyway, it is a live WebSocket client. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="zmrng" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-256.png" />
    <link rel="icon" type="image/png" href="/icon-256.png" />
    <title>zmrng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Modak&family=Lobster&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Boot veil — paints white on the app's first frame and fades out, so the
         splash's white bloom hands off seamlessly across the page navigation
         (covers the React mount gap; no React dependency). */
      #boot-veil {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #fff;
        pointer-events: none;
        animation: boot-fade 520ms ease-out forwards;
      }
      @keyframes boot-fade {
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-veil {
          animation: none;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-veil"></div>
    <div id="root"></div>
    <script>
      setTimeout(function () {
        var v = document.getElementById('boot-veil');
        if (v) v.remove();
      }, 600);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
