[package]
name = "zmrng"
version = "0.1.0"
description = "zmrng desktop shell"
authors = ["zc"]
edition = "2021"
rust-version = "1.77"

# The library + binary split is Tauri's convention; we keep a single binary.
[[bin]]
name = "zmrng"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
