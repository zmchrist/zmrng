<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zmrng</title>
    <style>
      /* Smoked-glass tokens mirrored from packages/web/src/theme.css. The galaxy
         composites over the glass veil (not a solid plate) so macOS vibrancy reads
         faintly behind it and the splash matches the app theme. */
      :root {
        --veil: rgba(9, 11, 14, 0.46);
        --smoke-floor: rgba(4, 6, 9, 0.34);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Glass veil — transparent body + two smoke-floor corner radials over --veil,
         mirroring theme.css body::after. The galaxy paints over this, not black. */
      #gl-veil {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(1200px 820px at 18% -12%, var(--smoke-floor), transparent 62%),
          radial-gradient(1000px 760px at 112% 116%, var(--smoke-floor), transparent 60%),
          var(--veil);
      }
      #gl-canvas {
        position: fixed;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Edge vignette — authored value, keeps the core readable over a bright desktop. */
      #gl-vignette {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(2, 3, 8, 0.55) 100%);
      }
      /* White bloom — masks the cross-navigation cut to the React app on the final frame. */
      #gl-bloom {
        position: fixed;
        inset: 0;
        z-index: 9;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="gl-veil"></div>
    <canvas id="gl-canvas"></canvas>
    <div id="gl-vignette"></div>
    <div id="gl-bloom"></div>

    <script>
      (function () {
        // --- props (hardcoded from the .dc.html data-props defaults) ---
        var ARMS = 6, FULLNESS = 1.65, VIBRANCE = 1.5, TILTX = 65, TILTY = 0, SPINZ = -22;
        var REDUCED = false;
        try { REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

        var canvas = document.getElementById('gl-canvas');
        var bloom = document.getElementById('gl-bloom');
        var ctx = canvas.getContext('2d');
        var w = 0, h = 0, dpr = 1;

        function randn() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }

        var CFG = {
          arms: Math.max(2, Math.min(7, Math.round(ARMS))),
          fullness: FULLNESS,
          vibrance: VIBRANCE
        };

        var ORI = (function () {
          var d = Math.PI / 180;
          var rz = SPINZ * d;
          return {
            sX: Math.cos(TILTY * d),
            sY: Math.cos(TILTX * d),
            cz: Math.cos(rz),
            sz: Math.sin(rz)
          };
        })();

        function makeBlob(r, g, b, peak) {
          var S = 256, cv = document.createElement('canvas');
          cv.width = cv.height = S;
          var c = cv.getContext('2d');
          var grd = c.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
          grd.addColorStop(0.0, 'rgba(' + r + ',' + g + ',' + b + ',' + peak + ')');
          grd.addColorStop(0.25, 'rgba(' + r + ',' + g + ',' + b + ',' + peak * 0.5 + ')');
          grd.addColorStop(0.6, 'rgba(' + r + ',' + g + ',' + b + ',' + peak * 0.12 + ')');
          grd.addColorStop(1.0, 'rgba(' + r + ',' + g + ',' + b + ',0)');
          c.fillStyle = grd; c.fillRect(0, 0, S, S);
          return cv;
        }

        var SPR = {
          core: makeBlob(255, 240, 208, 1),
          pale: makeBlob(255, 232, 198, 1),
          gold: makeBlob(255, 214, 168, 1),
          pink: makeBlob(255, 150, 172, 1),
          blue: makeBlob(176, 200, 255, 1),
          deep: makeBlob(120, 156, 240, 1),
          dust: makeBlob(28, 16, 14, 1)
        };
        var palette = [
          'rgba(255,246,228,0.85)',
          'rgba(255,236,206,0.8)',
          'rgba(255,224,192,0.75)',
          'rgba(232,226,224,0.7)',
          'rgba(202,214,248,0.72)',
          'rgba(170,196,255,0.7)'
        ];

        var clouds, dust, buckets, fg;
        function buildGalaxy() {
          var arms = CFG.arms, fullness = CFG.fullness;
          var TWIST = 2.7;
          var szK = 0.88 + 0.3 * fullness;

          clouds = [];
          var NCLOUD = Math.round(120 * fullness);
          for (var i = 0; i < NCLOUD; i++) {
            var r = Math.pow(Math.random(), 1.25);
            var arm = i % arms;
            var scatter = randn() * (0.34 * (1 - 0.4 * r));
            var a = arm * (Math.PI * 2 / arms) + r * TWIST + scatter;
            var spr, alpha;
            if (r < 0.13) { spr = SPR.core; alpha = 0.22; }
            else if (r < 0.3) { spr = SPR.pale; alpha = 0.17; }
            else if (r < 0.52) { spr = Math.random() < 0.42 ? SPR.pink : SPR.gold; alpha = 0.15; }
            else if (r < 0.74) { spr = Math.random() < 0.4 ? SPR.pink : SPR.blue; alpha = 0.12; }
            else { spr = SPR.deep; alpha = 0.075; }
            var base = (0.12 + 0.20 * r) * szK;
            clouds.push({ a: a, r: r, spr: spr, alpha: alpha, sl: base * 1.9, ss: base * 0.78 });
          }

          dust = [];
          var NDUST = Math.round((34 + 16 * arms));
          for (var i2 = 0; i2 < NDUST; i2++) {
            var r2 = 0.16 + Math.pow(Math.random(), 0.9) * 0.62;
            var arm2 = i2 % arms;
            var scatter2 = randn() * 0.12;
            var a2 = arm2 * (Math.PI * 2 / arms) + r2 * TWIST - 0.16 + scatter2;
            var base2 = (0.10 + 0.16 * r2) * szK;
            dust.push({ a: a2, r: r2, alpha: 0.30 + Math.random() * 0.25, sl: base2 * 2.0, ss: base2 * 0.6 });
          }

          buckets = palette.map(function () { return []; });
          var pushStar = function (a, r, s) {
            var bi = Math.min(palette.length - 1, Math.max(0, Math.floor(r * palette.length + randn() * 0.6)));
            buckets[bi].push(a, r, s);
          };
          for (var i3 = 0; i3 < Math.round(850 * (0.8 + 0.2 * fullness)); i3++) {
            var r3 = Math.pow(Math.random(), 2.6) * 0.32;
            pushStar(Math.random() * Math.PI * 2, r3, (0.7 + Math.random() * 0.8) * szK);
          }
          for (var i4 = 0; i4 < Math.round(2600 * fullness); i4++) {
            var r4 = Math.pow(Math.random(), 1.5);
            var arm4 = i4 % arms;
            var scatter4 = randn() * (0.46 * (1 - 0.42 * r4));
            var a4 = arm4 * (Math.PI * 2 / arms) + r4 * TWIST + scatter4;
            pushStar(a4, r4, (0.55 + Math.random() * 0.7) * szK);
          }
          for (var i5 = 0; i5 < Math.round(1000 * fullness); i5++) {
            var r5 = Math.pow(Math.random(), 1.1);
            pushStar(Math.random() * Math.PI * 2, r5, (0.45 + Math.random() * 0.5) * szK);
          }

          fg = [];
          for (var i6 = 0; i6 < Math.round(340 * fullness); i6++) {
            var inBulge = Math.random() < 0.4;
            var r6 = inBulge ? Math.pow(Math.random(), 2.2) * 0.3 : Math.pow(Math.random(), 1.4);
            var arm6 = i6 % arms;
            var a6 = inBulge ? Math.random() * Math.PI * 2
                             : arm6 * (Math.PI * 2 / arms) + r6 * TWIST + randn() * 0.4;
            fg.push({ a: a6, r: r6, s: (1.1 + Math.random() * 1.5) * (0.9 + 0.15 * fullness), ph: Math.random() * 6.28, sp: 0.6 + Math.random(), bright: Math.random() < 0.18 });
          }
        }

        buildGalaxy();

        var bg = [];
        for (var bi0 = 0; bi0 < 130; bi0++) {
          bg.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.2 + 0.4, ph: Math.random() * 6.28, sp: 0.4 + Math.random() * 0.9 });
        }

        var rot = 0, raf = 0, last = performance.now();

        // ---- warp / reveal state machine ----
        var phase = 'idle';
        var warpStart = 0;
        var WARP_DUR = 2500, ZMAX = 19;
        var port = null;
        var engineReady = false; // engine-ready handshake fired (port known, server up)
        var wantsWarp = false;   // user clicked / pressed Enter
        var navigated = false;

        function navigate() {
          if (navigated) return;
          navigated = true;
          if (port != null) {
            window.location.replace('http://localhost:' + port + '/');
          }
        }

        function startWarp() {
          if (phase !== 'idle') return;
          phase = 'warp';
          warpStart = performance.now();
          // Safety net: if the warp loop errors or stalls, force the navigate so the
          // app is never stranded behind the splash.
          setTimeout(navigate, 6000);
        }

        // Warp only once BOTH the engine is ready (port known, server up) AND the
        // user has asked to enter — so the splash always waits for the click/Enter,
        // and a click before the engine is up never navigates to a dead port (it
        // just arms the warp, which fires the moment the engine becomes ready).
        function maybeStartWarp() {
          if (phase === 'idle' && engineReady && wantsWarp) startWarp();
        }

        function requestWarp() {
          wantsWarp = true;
          maybeStartWarp();
        }

        window.addEventListener('pointerdown', requestWarp);
        window.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); requestWarp(); }
        });

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = canvas.clientWidth || canvas.parentElement.clientWidth || window.innerWidth;
          h = canvas.clientHeight || canvas.parentElement.clientHeight || window.innerHeight;
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);
        if (window.ResizeObserver) { new ResizeObserver(resize).observe(canvas); }

        function draw(now) {
          if (phase === 'done') return; // loop retired once warp completes

          var dt = Math.min(50, now - last) / 16.667;
          last = now;
          rot += 0.00042 * dt;

          var cw = canvas.clientWidth || canvas.parentElement.clientWidth || window.innerWidth;
          var ch = canvas.clientHeight || canvas.parentElement.clientHeight || window.innerHeight;
          if (Math.abs(cw - w) > 1 || Math.abs(ch - h) > 1) resize();

          // warp progression
          var Z = 1, whiteV = 0, warpAmt = 0;
          if (phase === 'warp') {
            var wp = Math.min(1, (now - warpStart) / WARP_DUR);
            var e = Math.pow(wp, 2.4);
            Z = 1 + e * (ZMAX - 1);
            warpAmt = e;
            whiteV = Math.min(1, Math.max(0, (wp - 0.58) / 0.36));
            if (!REDUCED) rot += 0.006 * dt * e; // swirl harder as we dive in (skip for reduced-motion)
            if (wp >= 1) {
              // warp finished on a full-white frame — hand off to the host app
              phase = 'done';
              bloom.style.opacity = '1';
              canvas.style.display = 'none';
              navigate();
              return;
            }
          }
          bloom.style.opacity = String(whiteV);

          var vib = CFG.vibrance * (1 - warpAmt * 0.6); // ease off glare as we dive in
          var sX = ORI.sX, sY = ORI.sY, cz = ORI.cz, sz = ORI.sz;
          var cx = w * 0.5, cy = h * 0.46;
          var gr = Math.min(w, h) * 0.42 * Z;
          var sizeK = 1 + (Z - 1) * 0.045; // slight streak as we accelerate
          var t = now * 0.001;

          ctx.globalCompositeOperation = 'source-over';
          ctx.clearRect(0, 0, w, h);
          var halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr * 1.5);
          halo.addColorStop(0, 'rgba(40,44,80,0.18)');
          halo.addColorStop(0.5, 'rgba(20,30,60,0.08)');
          halo.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = halo; ctx.fillRect(0, 0, w, h);

          if (phase === 'idle') {
            ctx.fillStyle = 'rgba(220,230,255,1)';
            for (var i = 0; i < bg.length; i++) {
              var b = bg[i];
              ctx.globalAlpha = (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * b.sp + b.ph))) * 0.7;
              ctx.fillRect(b.x * w, b.y * h, b.s, b.s);
            }
            ctx.globalAlpha = 1;
          }

          // disk stars
          ctx.globalCompositeOperation = 'lighter';
          for (var bk = 0; bk < buckets.length; bk++) {
            var arr = buckets[bk];
            ctx.fillStyle = palette[bk];
            for (var j = 0; j < arr.length; j += 3) {
              var aa = arr[j] + rot;
              var rr = arr[j + 1] * gr;
              var ss0 = arr[j + 2] * sizeK;
              var ex0 = Math.cos(aa) * rr * sX, ey0 = Math.sin(aa) * rr * sY;
              ctx.fillRect(cx + ex0 * cz - ey0 * sz, cy + ex0 * sz + ey0 * cz, ss0, ss0);
            }
          }

          // clouds + dust in oriented disk plane
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(Math.atan2(sz, cz));
          ctx.scale(sX, sY);

          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = Math.min(1, 0.55 * (0.7 + 0.5 * vib) + whiteV * 0.45);
          var bs = gr * 1.5;
          ctx.drawImage(SPR.core, -bs / 2, -bs / 2, bs, bs);
          ctx.globalAlpha = Math.min(1, 0.4 * (0.7 + 0.5 * vib) + whiteV * 0.4);
          bs = gr * 0.7;
          ctx.drawImage(SPR.pale, -bs / 2, -bs / 2, bs, bs);

          for (var ci = 0; ci < clouds.length; ci++) {
            var c = clouds[ci];
            var ca = c.a + rot;
            var cxp = Math.cos(ca) * c.r * gr, cyp = Math.sin(ca) * c.r * gr;
            var csl = c.sl * gr, css = c.ss * gr;
            ctx.globalAlpha = Math.min(1, c.alpha * vib);
            ctx.save();
            ctx.translate(cxp, cyp);
            ctx.rotate(ca + Math.PI / 2);
            ctx.drawImage(c.spr, -csl / 2, -css / 2, csl, css);
            ctx.restore();
          }

          ctx.globalCompositeOperation = 'source-over';
          for (var di = 0; di < dust.length; di++) {
            var d = dust[di];
            var da = d.a + rot;
            var dxp = Math.cos(da) * d.r * gr, dyp = Math.sin(da) * d.r * gr;
            var dsl = d.sl * gr, dss = d.ss * gr;
            ctx.globalAlpha = d.alpha * (1 - whiteV);
            ctx.save();
            ctx.translate(dxp, dyp);
            ctx.rotate(da + Math.PI / 2);
            ctx.drawImage(SPR.dust, -dsl / 2, -dss / 2, dsl, dss);
            ctx.restore();
          }
          ctx.globalAlpha = 1;
          ctx.restore();

          // foreground sparkle — twinkle intensifies as we dive in
          ctx.globalCompositeOperation = 'lighter';
          var twSpeed = 1 + warpAmt * 5; // faster shimmer during warp
          var twDepth = 0.45 + warpAmt * 0.18; // gentler light/dark swing
          for (var fi = 0; fi < fg.length; fi++) {
            var f = fg[fi];
            var fa = f.a + rot;
            var frr = f.r * gr;
            var tw = (1 - twDepth) + twDepth * (0.5 + 0.5 * Math.sin(t * f.sp * twSpeed + f.ph));
            ctx.globalAlpha = Math.min(1, tw);
            var fex = Math.cos(fa) * frr * sX, fey = Math.sin(fa) * frr * sY;
            var px = cx + fex * cz - fey * sz, py = cy + fex * sz + fey * cz;
            var fsz = f.s * sizeK;
            // bright stars flare with a cross-shine during the zoom
            if (warpAmt > 0.04 && f.bright && tw > 0.7) {
              var flare = (tw - 0.7) / 0.3 * warpAmt;
              var len = fsz * (3 + 6 * flare);
              ctx.strokeStyle = 'rgba(255,252,244,' + (0.32 * flare).toFixed(3) + ')';
              ctx.lineWidth = fsz * 0.5;
              ctx.beginPath();
              ctx.moveTo(px - len, py); ctx.lineTo(px + len, py);
              ctx.moveTo(px, py - len); ctx.lineTo(px, py + len);
              ctx.stroke();
            }
            ctx.fillStyle = 'rgba(255,250,240,0.95)';
            ctx.fillRect(px, py, fsz, fsz);
          }
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';

          raf = requestAnimationFrame(draw);
        }
        raf = requestAnimationFrame(draw);

        // ---- engine-ready handshake (Tauri only) ----
        // Requires withGlobalTauri so this no-build static splash can reach the API.
        // In plain-browser dev (window.__TAURI__ undefined) the galaxy idle-loops
        // forever — the splash is only ever seen inside the Tauri shell.
        var T = window.__TAURI__;
        if (T && T.event) {
          T.event.listen('engine-ready', function (ev) {
            var p = ev && ev.payload;
            if (typeof p === 'number') port = p;
            else if (p && typeof p === 'object' && typeof p.port === 'number') port = p.port;
            engineReady = true;
            maybeStartWarp(); // fires now only if the user already clicked/pressed Enter
          });
          T.event.emit('splash-ready');
        }
      })();
    </script>
  </body>
</html>
