<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zmrng</title>
    <style>
      /* Mirror of the few frosted-glass tokens this splash needs (packages/web/src/theme.css). */
      :root {
        --bg: #16181c;
        --bg-grad-a: #181b20;
        --surface: rgba(38, 41, 47, 0.5);
        --blur: 14px;
        --border: rgba(255, 255, 255, 0.08);
        --text: #e6e8ea;
        --text-dim: #9aa0a6;
        --accent: #7aa2c4;
        --accent-soft: rgba(122, 162, 196, 0.16);
        --radius: 14px;
        --shadow: 0 8px 28px rgba(0, 0, 0, 0.34);
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(1200px 800px at 20% -10%, var(--bg-grad-a), transparent 60%),
          radial-gradient(900px 700px at 110% 110%, #1b2027, transparent 55%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 32px 44px;
        background: var(--surface);
        backdrop-filter: blur(var(--blur));
        -webkit-backdrop-filter: blur(var(--blur));
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .sub {
        font-size: 13px;
        color: var(--text-dim);
      }
      .spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid var(--accent-soft);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <div class="title">zmrng</div>
      <div class="sub">starting engine…</div>
    </div>
  </body>
</html>
