<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zmrng</title>
    <style>
      /* Mirror of the few smoked-glass tokens this splash needs (packages/web/src/theme.css).
         Body stays transparent so the macOS window vibrancy shows from first paint. */
      :root {
        --veil: rgba(9, 11, 14, 0.42);
        --surface: rgba(26, 29, 35, 0.55);
        --blur: 26px;
        --border: rgba(255, 255, 255, 0.07);
        --text: #f0f2f5;
        --text-dim: #aab0b9;
        --accent: #c6cfdd;
        --accent-soft: rgba(198, 207, 221, 0.14);
        --radius: 18px;
        --shadow: 0 18px 44px rgba(0, 0, 0, 0.46);
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
      }
      body {
        display: grid;
        place-items: center;
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(900px 640px at 50% 120%, var(--veil), transparent 60%);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 34px 48px;
        background: var(--surface);
        backdrop-filter: saturate(116%) blur(var(--blur));
        -webkit-backdrop-filter: saturate(116%) blur(var(--blur));
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      .title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: lowercase;
      }
      .sub {
        font-size: 13px;
        color: var(--text-dim);
      }
      .spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid var(--accent-soft);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <div class="title">zmrng</div>
      <div class="sub">starting engine…</div>
    </div>
  </body>
</html>
